<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<!-- תבנית לתמונות הבלוג: שער (1200x630, רקע כהה) ואיור בתוך כתבה (1200x675, רקע בהיר).
     scripts/cover.js ממלא את המידות, ערכת הצבע, צבע ההדגשה ותוכן העמוד, ומצלם עם Chrome.
     האיורים הם מוקאפים של ממשקים בשפה של האתר: מעט טקסט, הרבה צורה. -->
<style>
@font-face { font-family: "Heebo"; font-weight: 400 900; font-display: block;
  src: url("__ROOT__/assets/fonts/heebo-hebrew.woff2") format("woff2");
  unicode-range: U+0307-0308, U+0590-05FF, U+200C-2010, U+20AA, U+25CC, U+FB1D-FB4F; }
@font-face { font-family: "Heebo"; font-weight: 400 900; font-display: block;
  src: url("__ROOT__/assets/fonts/heebo-latin.woff2") format("woff2");
  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC,
                 U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215; }

:root {
  --ink: #1B1840; --ink-700: #2E2870; --brand: #4F39F6; --brand-400: #7C6CF9; --brand-100: #DDD8FE;
  --line: #E6E8F2; --sk: #E6E8F2; --sk-2: #F1F2F8; --muted: #8288A1; --ok: #10B981; --bad: #F43F5E;
  --accent: __ACCENT__;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: __W__px; height: __H__px; overflow: hidden; }
body { font-family: "Heebo", sans-serif; position: relative; color: var(--ink); }

/* ---------------- רקעים ---------------- */
body.dark { color: #fff; background: linear-gradient(135deg, var(--ink) 0%, var(--ink-700) 55%, #4030A8 100%); }
body.light { background: linear-gradient(160deg, #F7F8FD 0%, #EEF0FE 100%); }
.dots { position: absolute; inset: 0; background-size: 26px 26px; }
.dark .dots { background-image: radial-gradient(rgba(255, 255, 255, .13) 1.6px, transparent 1.7px); }
.light .dots { background-image: radial-gradient(rgba(79, 57, 246, .10) 1.6px, transparent 1.7px); }
.glow { position: absolute; border-radius: 50%; }
.glow--a { width: 820px; height: 640px; left: -240px; top: -260px;
  background: radial-gradient(closest-side, color-mix(in srgb, var(--accent) 40%, transparent), transparent); }
.glow--b { width: 720px; height: 560px; right: -220px; bottom: -320px;
  background: radial-gradient(closest-side, rgba(244, 63, 94, .26), transparent); }
.light .glow--a { opacity: .55; } .light .glow--b { opacity: .35; }

/* ---------------- שער: מותג, מספר, מילה ---------------- */
.brandbar { position: absolute; top: 44px; right: 52px; display: flex; align-items: center; gap: 14px; z-index: 5; }
.logo { background: #fff; border-radius: 16px; padding: 10px 18px 10px 14px; display: flex;
  box-shadow: 0 14px 34px -16px rgba(0, 0, 0, .6); }
.logo img { height: 40px; display: block; }
.tag { font-size: 21px; font-weight: 700; color: var(--ink); background: var(--accent); padding: 7px 18px; border-radius: 999px; }
.badge { position: absolute; right: 52px; top: 50%; transform: translateY(-46%); width: 300px; z-index: 5; text-align: right; }
.badge__value { font-size: 116px; font-weight: 900; line-height: .95; letter-spacing: -.03em; color: var(--accent); direction: ltr; text-align: right; }
.badge__label { margin-top: 14px; font-size: 27px; font-weight: 700; line-height: 1.25; }
.kicker { position: absolute; right: 52px; bottom: 50px; width: 300px; font-size: 30px; font-weight: 800; line-height: 1.15; z-index: 5; }
.kicker em { font-style: normal; color: var(--accent); }

/* אזור האיור. בשער הוא משמאל וקצת מוטה, באיור לכתבה הוא במרכז */
.scene { position: absolute; }
.cover .scene { left: 56px; top: 58px; width: 760px; height: 514px; transform: perspective(1800px) rotateY(9deg) rotateX(2deg); transform-origin: left center; }
.figure .scene { left: 100px; top: 56px; width: 1000px; height: 563px; }

/* ---------------- רכיבי מוקאפ ---------------- */
.win { position: absolute; background: #fff; border-radius: 22px; overflow: hidden; color: var(--ink);
  box-shadow: 0 50px 90px -40px rgba(10, 8, 40, .75), 0 0 0 1px rgba(27, 24, 64, .06); }
.win__bar { height: 46px; background: var(--sk-2); display: flex; align-items: center; gap: 9px; padding: 0 18px; direction: ltr; }
.win__bar i { width: 12px; height: 12px; border-radius: 50%; background: #FF5F57; }
.win__bar i:nth-child(2) { background: #FEBC2E; } .win__bar i:nth-child(3) { background: #28C840; }
.win__url { margin-left: 14px; flex: 1; height: 26px; border-radius: 13px; background: #fff; border: 1px solid var(--line); }
.sk { display: block; height: 12px; border-radius: 6px; background: var(--sk); }
.sk--dark { background: #C9CCE0; } .sk--title { height: 16px; background: #B9C2F5; } .sk--url { height: 10px; background: #BFE9D6; }
.pill { display: inline-flex; align-items: center; gap: 8px; font-size: 17px; font-weight: 700; padding: 6px 14px; border-radius: 999px; }
.mark { position: absolute; width: 38px; height: 38px; border-radius: 50%; background: var(--bad); color: #fff; font-weight: 900;
  font-size: 24px; display: grid; place-items: center; box-shadow: 0 0 0 7px rgba(244, 63, 94, .22); }
.okmark { position: absolute; width: 34px; height: 34px; border-radius: 50%; background: var(--ok); display: grid; place-items: center;
  box-shadow: 0 0 0 7px rgba(16, 185, 129, .2); }
.okmark svg, .mark svg { width: 20px; height: 20px; }

/* אייקון בטבעות, כשאין מוקאפ שמתאים */
.iconart { position: absolute; inset: 0; display: grid; place-items: center; }
.iconart .ring { position: absolute; border-radius: 50%; border: 1.5px solid rgba(255, 255, 255, .16); }
.light .iconart .ring { border-color: rgba(79, 57, 246, .16); }
.iconart svg { position: relative; width: 170px; height: 170px; color: var(--accent); }
</style>
</head>
<body class="__THEME__ __KIND__">
<div class="dots"></div>
<div class="glow glow--a"></div>
<div class="glow glow--b"></div>
__BODY__
</body>
</html>
